<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1220">
  <title>حارس الهاتف — صوري</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z"/><path class="cut" d="M9 12.5l2 2 4-4.5"/></svg>
      <div>
        <h1>حارس الهاتف</h1>
        <p class="sub">صور من حاول فتح هاتفك، مع موقعه</p>
      </div>
    </header>

    <section id="login" class="card">
      <h2>تسجيل الدخول</h2>
      <p class="muted">استخدم نفس البريد وكلمة المرور الموجودين في التطبيق.</p>
      <form id="loginForm" autocomplete="on">
        <label>البريد الإلكتروني
          <input id="email" type="email" dir="ltr" required autocomplete="username">
        </label>
        <label>كلمة المرور
          <input id="pass" type="password" dir="ltr" required autocomplete="current-password">
        </label>
        <button id="loginBtn" class="btn primary" type="submit">دخول</button>
        <p id="loginMsg" class="msg" role="status"></p>
      </form>
    </section>

    <section id="gallery" hidden>
      <div class="toolbar">
        <div>
          <p class="muted small">الحساب</p>
          <p id="who" class="who" dir="ltr"></p>
        </div>
        <div class="actions">
          <button id="reloadBtn" class="btn ghost" type="button" aria-label="تحديث">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>
            تحديث
          </button>
          <button id="logoutBtn" class="btn ghost" type="button">خروج</button>
        </div>
      </div>
      <p id="galleryMsg" class="msg" role="status"></p>
      <div id="grid" class="grid"></div>
    </section>

    <footer class="foot">المصمم والمنفذ: ماجد أبو سيدرا</footer>
  </main>

  <div id="viewer" class="viewer" hidden>
    <button id="viewerClose" class="viewer-close" type="button" aria-label="إغلاق">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <img id="viewerImg" alt="">
  </div>

  <script src="app.js"></script>
</body>
</html>
