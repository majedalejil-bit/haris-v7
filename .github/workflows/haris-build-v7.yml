name: Build Haris APK v7
on:
  workflow_dispatch:
    inputs:
      api_key:
        description: "Firebase apiKey (starts with AIza)"
        required: true
        type: string
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Generate project
        env:
          API_KEY: ${{ inputs.api_key }}
        run: |
          case "$API_KEY" in AIza*) ;; *) echo "apiKey must start with AIza"; exit 1;; esac
          mkdir -p app/src/main/java/com/haris/guard app/src/main/res/xml

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "haris"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.haris.guard"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.haris.guardv7"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 7
                  versionName = "7.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-feature android:name="android.hardware.camera" android:required="false"/>
              <application
                  android:label="حارس الهاتف v7"
                  android:icon="@android:drawable/ic_lock_idle_lock"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".LoginActivity"
                      android:exported="false"
                      android:windowSoftInputMode="adjustResize"/>
                  <receiver
                      android:name=".AdminReceiver"
                      android:exported="true"
                      android:permission="android.permission.BIND_DEVICE_ADMIN">
                      <meta-data android:name="android.app.device_admin" android:resource="@xml/device_admin"/>
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED"/>
                      </intent-filter>
                  </receiver>
                  <receiver
                      android:name=".GuardReceiver"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                      </intent-filter>
                  </receiver>
                  <service
                      android:name=".GuardService"
                      android:exported="false"
                      android:foregroundServiceType="camera"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/device_admin.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies>
                  <watch-login/>
              </uses-policies>
          </device-admin>
          EOF

          cat > app/src/main/java/com/haris/guard/FirebaseCfg.kt <<'EOF'
          package com.haris.guard

          object FirebaseCfg {
              const val API_KEY = "__API_KEY__"
              const val PROJECT = "hars-983d4"
              const val DOCS = "https://firestore.googleapis.com/v1/projects/hars-983d4/databases/(default)/documents"
          }
          EOF

          cat > app/src/main/java/com/haris/guard/Ui.kt <<'EOF'
          package com.haris.guard

          import android.content.Context
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.text.InputType
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView

          object Ui {
              val BG = 0xFF0B1220.toInt()
              val CARD = 0xFF182235.toInt()
              val ACCENT = 0xFF3B82F6.toInt()
              val TEXT = 0xFFFFFFFF.toInt()
              val MUTED = 0xFF94A3B8.toInt()

              fun dp(c: Context, v: Int): Int = (v * c.resources.displayMetrics.density).toInt()

              private fun shape(color: Int, radius: Float): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(color)
                  g.cornerRadius = radius
                  return g
              }

              private fun lp(c: Context, top: Int): LinearLayout.LayoutParams {
                  val p = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  p.topMargin = dp(c, top)
                  return p
              }

              fun page(c: Context): LinearLayout {
                  val l = LinearLayout(c)
                  l.orientation = LinearLayout.VERTICAL
                  l.layoutDirection = View.LAYOUT_DIRECTION_RTL
                  l.setPadding(dp(c, 20), dp(c, 48), dp(c, 20), dp(c, 32))
                  l.setBackgroundColor(BG)
                  return l
              }

              fun text(c: Context, t: String, color: Int, size: Float, top: Int = 8): TextView {
                  val v = TextView(c)
                  v.text = t
                  v.setTextColor(color)
                  v.textSize = size
                  v.layoutParams = lp(c, top)
                  return v
              }

              fun title(c: Context, t: String): TextView {
                  val v = text(c, t, TEXT, 26f, 0)
                  v.setTypeface(v.typeface, Typeface.BOLD)
                  return v
              }

              fun section(c: Context, t: String): TextView {
                  val v = text(c, t, TEXT, 18f, 28)
                  v.setTypeface(v.typeface, Typeface.BOLD)
                  return v
              }

              fun button(c: Context, t: String, primary: Boolean, onClick: () -> Unit): Button {
                  val b = Button(c)
                  b.text = t
                  b.isAllCaps = false
                  b.setTextColor(TEXT)
                  b.textSize = 15f
                  b.background = shape(if (primary) ACCENT else CARD, dp(c, 14).toFloat())
                  b.layoutParams = lp(c, 12)
                  b.setOnClickListener { onClick() }
                  return b
              }

              fun input(c: Context, hint: String, password: Boolean, email: Boolean): EditText {
                  val e = EditText(c)
                  e.hint = hint
                  e.setTextColor(TEXT)
                  e.setHintTextColor(MUTED)
                  e.setSingleLine(true)
                  e.textDirection = View.TEXT_DIRECTION_LTR
                  e.background = shape(CARD, dp(c, 12).toFloat())
                  e.setPadding(dp(c, 16), dp(c, 14), dp(c, 16), dp(c, 14))
                  e.inputType = when {
                      password -> InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                      email -> InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_EMAIL_ADDRESS
                      else -> InputType.TYPE_CLASS_TEXT
                  }
                  e.layoutParams = lp(c, 12)
                  return e
              }
          }
          EOF

          cat > app/src/main/java/com/haris/guard/Auth.kt <<'EOF'
          package com.haris.guard

          import android.content.Context
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder

          object Auth {
              private fun prefs(c: Context) = c.getSharedPreferences("auth", Context.MODE_PRIVATE)

              fun loggedIn(c: Context): Boolean = (prefs(c).getString("refresh", "") ?: "").isNotBlank()

              fun email(c: Context): String = prefs(c).getString("email", "") ?: ""

              fun uid(c: Context): String = prefs(c).getString("uid", "") ?: ""

              fun logout(c: Context) {
                  prefs(c).edit().clear().apply()
              }

              private fun post(url: String, body: String, type: String): Pair<Int, String> {
                  val conn = URL(url).openConnection() as HttpURLConnection
                  conn.connectTimeout = 15000
                  conn.readTimeout = 15000
                  conn.requestMethod = "POST"
                  conn.doOutput = true
                  conn.setRequestProperty("Content-Type", type)
                  conn.outputStream.use { it.write(body.toByteArray()) }
                  val code = conn.responseCode
                  val s = if (code in 200..299) conn.inputStream else conn.errorStream
                  val text = s?.bufferedReader()?.use { it.readText() } ?: ""
                  return Pair(code, text)
              }

              private fun errorText(raw: String): String {
                  val m = try {
                      JSONObject(raw).getJSONObject("error").getString("message")
                  } catch (e: Exception) {
                      ""
                  }
                  return when {
                      m.startsWith("EMAIL_EXISTS") -> "هذا البريد مسجّل من قبل، اضغط تسجيل الدخول"
                      m.startsWith("WEAK_PASSWORD") -> "كلمة المرور ضعيفة، اكتب 6 أحرف أو أكثر"
                      m.startsWith("INVALID_EMAIL") -> "صيغة البريد غير صحيحة"
                      m.startsWith("EMAIL_NOT_FOUND") -> "هذا البريد غير مسجّل، اضغط إنشاء حساب جديد"
                      m.startsWith("INVALID_PASSWORD") || m.startsWith("INVALID_LOGIN_CREDENTIALS") -> "البريد أو كلمة المرور غير صحيحة"
                      m.startsWith("TOO_MANY_ATTEMPTS") -> "محاولات كثيرة، انتظر قليلًا ثم أعد المحاولة"
                      m.startsWith("OPERATION_NOT_ALLOWED") -> "تسجيل البريد وكلمة المرور غير مفعّل في Firebase"
                      m.contains("API key") -> "مفتاح Firebase (apiKey) غير صحيح"
                      m.isBlank() -> "تعذّر الاتصال"
                      else -> "خطأ: $m"
                  }
              }

              private fun sign(c: Context, endpoint: String, email: String, pass: String): String {
                  return try {
                      val body = JSONObject()
                          .put("email", email)
                          .put("password", pass)
                          .put("returnSecureToken", true)
                          .toString()
                      val r = post(
                          "https://identitytoolkit.googleapis.com/v1/accounts:" + endpoint + "?key=" + FirebaseCfg.API_KEY,
                          body,
                          "application/json"
                      )
                      if (r.first != 200) return errorText(r.second)
                      val j = JSONObject(r.second)
                      val exp = System.currentTimeMillis() + j.getString("expiresIn").toLong() * 1000
                      prefs(c).edit()
                          .putString("id", j.getString("idToken"))
                          .putString("refresh", j.getString("refreshToken"))
                          .putString("uid", j.getString("localId"))
                          .putString("email", email)
                          .putLong("exp", exp)
                          .apply()
                      "ok"
                  } catch (e: Exception) {
                      "لا يوجد اتصال بالإنترنت"
                  }
              }

              fun signIn(c: Context, email: String, pass: String): String = sign(c, "signInWithPassword", email, pass)

              fun signUp(c: Context, email: String, pass: String): String = sign(c, "signUp", email, pass)

              @Synchronized
              fun token(c: Context): String {
                  val p = prefs(c)
                  val refresh = p.getString("refresh", "") ?: ""
                  if (refresh.isBlank()) return ""
                  if (System.currentTimeMillis() < p.getLong("exp", 0L) - 60000L) {
                      return p.getString("id", "") ?: ""
                  }
                  return try {
                      val body = "grant_type=refresh_token&refresh_token=" + URLEncoder.encode(refresh, "UTF-8")
                      val r = post(
                          "https://securetoken.googleapis.com/v1/token?key=" + FirebaseCfg.API_KEY,
                          body,
                          "application/x-www-form-urlencoded"
                      )
                      if (r.first != 200) return ""
                      val j = JSONObject(r.second)
                      val exp = System.currentTimeMillis() + j.getString("expires_in").toLong() * 1000
                      p.edit()
                          .putString("id", j.getString("id_token"))
                          .putString("refresh", j.getString("refresh_token"))
                          .putLong("exp", exp)
                          .apply()
                      j.getString("id_token")
                  } catch (e: Exception) {
                      ""
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/haris/guard/CloudStore.kt <<'EOF'
          package com.haris.guard

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.util.Base64
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL

          object CloudStore {
              private fun post(url: String, token: String, body: String): Pair<Int, String> {
                  val conn = URL(url).openConnection() as HttpURLConnection
                  conn.connectTimeout = 20000
                  conn.readTimeout = 30000
                  conn.requestMethod = "POST"
                  conn.doOutput = true
                  conn.setRequestProperty("Content-Type", "application/json")
                  conn.setRequestProperty("Authorization", "Bearer $token")
                  conn.outputStream.use { it.write(body.toByteArray()) }
                  val code = conn.responseCode
                  val s = if (code in 200..299) conn.inputStream else conn.errorStream
                  val text = s?.bufferedReader()?.use { it.readText() } ?: ""
                  return Pair(code, text)
              }

              private fun small(f: File): ByteArray {
                  val bmp = BitmapFactory.decodeFile(f.path) ?: return f.readBytes()
                  val out = ByteArrayOutputStream()
                  bmp.compress(Bitmap.CompressFormat.JPEG, 70, out)
                  bmp.recycle()
                  return out.toByteArray()
              }

              fun upload(c: Context, f: File, token: String): String {
                  return try {
                      val uid = Auth.uid(c)
                      val b64 = Base64.encodeToString(small(f), Base64.NO_WRAP)
                      val fields = JSONObject()
                          .put("img", JSONObject().put("stringValue", b64))
                          .put("time", JSONObject().put("integerValue", f.lastModified().toString()))
                      val body = JSONObject().put("fields", fields).toString()
                      val r = post(FirebaseCfg.DOCS + "/users/" + uid + "/photos", token, body)
                      when (r.first) {
                          200 -> "ok"
                          401, 403 -> "لا توجد صلاحية، انشر قواعد Firestore أو أعد تسجيل الدخول"
                          else -> "خطأ " + r.first
                      }
                  } catch (e: Exception) {
                      "لا يوجد اتصال (" + e.javaClass.simpleName + ")"
                  }
              }

              fun list(c: Context, token: String): List<Pair<Long, ByteArray>>? {
                  return try {
                      val uid = Auth.uid(c)
                      val order = JSONObject()
                          .put("field", JSONObject().put("fieldPath", "time"))
                          .put("direction", "DESCENDING")
                      val sq = JSONObject()
                          .put("from", JSONArray().put(JSONObject().put("collectionId", "photos")))
                          .put("orderBy", JSONArray().put(order))
                          .put("limit", 20)
                      val body = JSONObject().put("structuredQuery", sq).toString()
                      val r = post(FirebaseCfg.DOCS + "/users/" + uid + ":runQuery", token, body)
                      if (r.first != 200) return null
                      val arr = JSONArray(r.second)
                      val out = ArrayList<Pair<Long, ByteArray>>()
                      for (i in 0 until arr.length()) {
                          val d = arr.getJSONObject(i).optJSONObject("document") ?: continue
                          val fl = d.getJSONObject("fields")
                          val img = fl.getJSONObject("img").getString("stringValue")
                          val t = fl.getJSONObject("time").getString("integerValue").toLong()
                          out.add(Pair(t, Base64.decode(img, Base64.DEFAULT)))
                      }
                      out
                  } catch (e: Exception) {
                      null
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/haris/guard/Uploader.kt <<'EOF'
          package com.haris.guard

          import android.content.Context
          import java.io.File

          object Uploader {
              private val lock = Any()
              @Volatile private var lastMsg = ""

              private fun logOnce(c: Context, m: String) {
                  if (m != lastMsg) {
                      lastMsg = m
                      PhotoStore.log(c, m)
                  }
              }

              fun pending(c: Context): Int =
                  PhotoStore.dir(c).listFiles()?.count { it.name.startsWith("img_") } ?: 0

              fun flush(c: Context) {
                  Thread {
                      synchronized(lock) {
                          if (!Auth.loggedIn(c)) return@synchronized
                          val files = PhotoStore.dir(c).listFiles()
                              ?.filter { it.name.startsWith("img_") }
                              ?.sortedBy { it.lastModified() }
                              ?: return@synchronized
                          if (files.isEmpty()) return@synchronized
                          val t = Auth.token(c)
                          if (t.isBlank()) {
                              logOnce(c, "تعذّر تجديد الدخول، سجّل الدخول من جديد")
                              return@synchronized
                          }
                          for (f in files) {
                              val r = CloudStore.upload(c, f, t)
                              if (r == "ok") {
                                  f.renameTo(File(f.parentFile, "sent_" + f.name))
                                  lastMsg = ""
                                  PhotoStore.log(c, "رُفعت صورة إلى حسابك")
                              } else {
                                  logOnce(c, "فشل الرفع: $r")
                                  break
                              }
                          }
                      }
                  }.start()
              }
          }
          EOF

          cat > app/src/main/java/com/haris/guard/PhotoStore.kt <<'EOF'
          package com.haris.guard

          import android.content.Context
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          object PhotoStore {
              fun dir(c: Context): File = File(c.getExternalFilesDir(null), "intruders").also { it.mkdirs() }

              fun log(c: Context, m: String) {
                  try {
                      val f = File(c.filesDir, "log.txt")
                      if (f.exists() && f.length() > 20000) {
                          f.writeText(f.readLines().takeLast(30).joinToString("\n") + "\n")
                      }
                      val t = SimpleDateFormat("HH:mm:ss dd/MM", Locale.US).format(Date())
                      f.appendText("$t  $m\n")
                  } catch (_: Exception) {}
              }

              fun lastLog(c: Context): String {
                  val f = File(c.filesDir, "log.txt")
                  return if (f.exists()) f.readLines().takeLast(8).joinToString("\n") else "(فارغ)"
              }
          }
          EOF

          cat > app/src/main/java/com/haris/guard/AdminReceiver.kt <<'EOF'
          package com.haris.guard

          import android.app.admin.DeviceAdminReceiver
          import android.content.Context
          import android.content.Intent

          class AdminReceiver : DeviceAdminReceiver() {
              override fun onPasswordFailed(context: Context, intent: Intent) {
                  PhotoStore.log(context, "محاولة فاشلة")
                  val s = GuardService.instance
                  if (s != null) s.capture() else PhotoStore.log(context, "الخدمة غير شغالة")
              }
          }
