name: Build Haris APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/haris-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: haris-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Fixed signing key (from secrets)
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "Secret KEYSTORE_B64 is missing"; exit 1; fi
          echo "$KS_B64" | base64 -d > app/haris.keystore
      - name: Build
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VC=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          cp app/build/outputs/apk/debug/app-debug.apk haris.apk
          gh release delete "v$VC" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "v$VC" haris.apk --repo "$GITHUB_REPOSITORY" --title "حارس الهاتف v$VC" --notes "حارس الهاتف — الإصدار $VC" --latest
          cp haris.apk haris-v7.apk
          gh release upload v7 haris-v7.apk --clobber --repo "$GITHUB_REPOSITORY" || true
          gh release edit "v$VC" --latest --repo "$GITHUB_REPOSITORY" || true
